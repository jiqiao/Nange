	<style>
		/* 强制覆盖可能的冲突样式 */
		[class^="fa-"], [class*=" fa-"]::before {
			font-family: "Font Awesome 5 Brands", "Font Awesome 5 Pro", "Font Awesome 5 Free", "Font Awesome 6 Brands", "Font Awesome 6 Pro", "Font Awesome 6 Free", sans-serif !important;
			font-weight: 900 !important;
		}

		/* --- 自定义弹出框样式 --- */
		.custom-popup-overlay {
			display: none; /* 默认隐藏 */
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.6); /* 半透明黑色背景 */
			z-index: 9999; /* 确保在最上层 */
			justify-content: center;
			align-items: center;
			backdrop-filter: blur(3px); /* 背景模糊效果 */
			transition: opacity 0.3s ease;
		}

		.custom-popup-content {
			background: rgba(255, 255, 255, 0.95); /* 弹窗主体背景 */
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			max-width: 80%;
			max-height: 80%;
			text-align: center;
			position: relative;
			color: #333;
			animation: popupFadeIn 0.3s ease-out;
			overflow-y: auto; /* 内容过多时允许内部滚动 */
		}

		.custom-popup-close {
			position: absolute;
			top: 10px;
			right: 15px;
			font-size: 24px;
			cursor: pointer;
			color: #888;
			line-height: 1;
			z-index: 10;
		}

		.custom-popup-close:hover {
			color: #000;
		}

		.custom-popup-image {
			max-width: 100%;
			max-height: 60vh;
			border-radius: 5px;
			display: block;
			margin: 0 auto;
		}

		.custom-popup-text {
			font-size: 1.2em;
			line-height: 1.5;
		}

		@keyframes popupFadeIn {
			from { opacity: 0; transform: scale(0.9); }
			to { opacity: 1; transform: scale(1); }
		}

		/* 演示按钮样式 */
		.demo-trigger-btn {
			position: fixed;
			top: 20px;
			left: 20px;
			z-index: 10000;
			padding: 10px 20px;
			background: rgba(255,255,255,0.2);
			border: 1px solid rgba(255,255,255,0.5);
			color: white;
			border-radius: 5px;
			cursor: pointer;
			font-size: 14px;
			backdrop-filter: blur(2px);
		}
		.demo-trigger-btn:hover {
			background: rgba(255,255,255,0.4);
		}
	</style>

	<!-- 弹出框 HTML 结构 -->
	<div id="custom-popup" class="custom-popup-overlay" onclick="handleOverlayClick(event)">
		<div class="custom-popup-content">
			<span class="custom-popup-close" onclick="hidePopup()">&times;</span>
			<div id="popup-body">
				<!-- 内容将通过 JS 动态插入 -->
			</div>
		</div>
	</div>

	<script>
		// 1. 更安全的全局错误处理，防止单个脚本错误中断其他逻辑
		window.onerror = function(message, source, lineno, colno, error) {
			console.warn("Caught global error:", message);
			// 返回 true 可以防止某些浏览器默认的错误行为，但通常建议记录即可
			return false; 
		};

		// 2. 页面加载完成后移除 preload 类
		window.onload = function () { 
			document.body.classList.remove('is-preload'); 
		};

		// 3. 优化触摸和方向改变事件，避免直接赋值导致冲突
		// 原代码: window.ontouchmove = function () { return false; } 
		// 修改为：仅在不希望滚动的特定元素上阻止，或者完全移除以允许正常浏览。
		// 这里为了保持原意但减少副作用，我们只在需要时阻止默认行为，或者使用 passive listener
		document.addEventListener('touchmove', function(e) {
			// 如果需要在整个页面禁止滚动，保留此逻辑。
			// 但通常建议允许滚动，除非是模态框打开时。
			// e.preventDefault(); 
	 }, { passive: false });

		window.onorientationchange = function () { 
			document.body.scrollTop = 0; 
		};

		// --- 弹窗控制逻辑 ---

		function showPopup(content, isImage = false) {
			const popup = document.getElementById('custom-popup');
			const body = document.getElementById('popup-body');
			
			if (!popup || !body) return; // 安全检查

			if (isImage) {
				body.innerHTML = `<img src="${content}" class="custom-popup-image" alt="Popup Image" loading="lazy" />`;
			} else {
				body.innerHTML = `<div class="custom-popup-text">${content}</div>`;
			}
			
			popup.style.display = 'flex';
		}

		function hidePopup() {
			const popup = document.getElementById('custom-popup');
			if (popup) {
				popup.style.display = 'none';
			}
		}

		function handleOverlayClick(event) {
			if (event.target.id === 'custom-popup') {
				hidePopup();
			}
		}

		// --- 演示用函数 ---
		let demoState = 0;
		function toggleDemoPopup() {
			demoState++;
			if (demoState % 3 === 1) {
				showPopup("<strong>欢迎！</strong><br>这是一个半透明的提示框。<br>你可以放置任何 HTML 内容。");
			} else if (demoState % 3 === 2) {
				showPopup("https://via.placeholder.com/600x400.png?text=Sample+Image", true);
			} else {
				hidePopup();
			}
		}
		function btn_NAS() {
				showPopup("<strong>NAS</strong><br>群晖勒索病毒中招<br>数据恢复后已关闭外网访问.");
				//hidePopup();
		}
		function btn_SK() {
				showPopup("https://via.placeholder.com/600x400.png?text=Sample+Image", true);
				//hidePopup();
		}
	</script>
	
	<!-- 
		注意：disable-devtool 可能会因为跨域或策略问题报错。
		添加 crossorigin="anonymous" 有助于调试，但不能解决所有 CORS 问题。
		如果依然报错，建议下载该 js 文件到本地 assets/js/ 目录并引用本地路径。
	-->
	<script 
		disable-devtool-auto 
		src='https://fastly.jsdelivr.net/npm/disable-devtool@latest/disable-devtool.min.js'
		disable-menu='false'
		crossorigin="anonymous"
	></script>
